<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>PixelGuard — تجربة الـ API</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  img { max-width: 100%; margin-top: 10px; border-radius: 8px; }
  button { padding: 10px 20px; cursor: pointer; }
  .row { margin-bottom: 16px; }
  #status { color: #666; }
</style>
</head>
<body>
  <h1>🛡️ PixelGuard API — Demo</h1>

  <!-- غيّر اللينك ده بعد ما تعمل modal deploy، هيظهرلك في التيرمينال -->
  <p>Endpoint: <code id="endpointDisplay">عدل IMMUNIZE_URL تحت في الكود</code></p>

  <div class="row">
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <div class="row">
    <label>Epsilon: <input type="number" id="eps" value="0.02" step="0.01" min="0.01" max="0.2"></label>
    <label>Iterations: <input type="number" id="iters" value="50" step="10" min="10" max="200"></label>
  </div>
  <button onclick="runImmunize()">🛡️ طبّق الحماية</button>
  <p id="status"></p>
  <img id="resultImg" alt="">

<script>
// ⚠️ عدّل اللينك ده بعد ما تعمل modal deploy — بيظهرلك في التيرمينال
// شكله تقريباً: https://<username>--pixelguard-immunize.modal.run
const IMMUNIZE_URL = "https://YOUR-USERNAME--pixelguard-immunize.modal.run";

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function runImmunize() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) { alert("اختار صورة الأول"); return; }

  const status = document.getElementById("status");
  status.textContent = "⏳ جاري التحميل والحماية... (أول مرة ممكن تاخد شوية ثواني لصحيان الـ container)";

  const imageBase64 = await fileToBase64(file);
  const eps = parseFloat(document.getElementById("eps").value);
  const iters = parseInt(document.getElementById("iters").value);

  try {
    const res = await fetch(IMMUNIZE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image_base64: imageBase64, eps, iters }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    document.getElementById("resultImg").src = "data:image/png;base64," + data.image_base64;
    status.textContent = `✅ تمت الحماية (${data.iters_used} iterations)`;
  } catch (err) {
    status.textContent = "❌ حصل خطأ: " + err.message;
  }
}
</script>
</body>
</html>
